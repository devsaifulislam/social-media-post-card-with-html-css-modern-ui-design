<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Media Post Card with HTML &amp; CSS ❤️ | Modern UI Design</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<article class="social-post">
  <header class="post-header">
    <div class="post-author">
      <div class="author-avatar">
        <img
          src="https://i.pravatar.cc/100?img=12"
          alt="Saiful Islam"
        >
        <span class="online-dot"></span>
      </div>

      <div>
        <h1>
          Saiful Islam
          <span class="verified">✓</span>
        </h1>

        <p>2 hours ago · 🌎</p>
      </div>
    </div>

    <button class="more-button" type="button" aria-label="More options">
      •••
    </button>
  </header>

  <div class="post-content">
    <p>
      Just completed this modern workspace setup! What do you think
      about the new design? ✨
    </p>

    <a href="#" class="post-tag">#WorkspaceDesign</a>
  </div>

  <div class="post-image">
    <img
      src="https://picsum.photos/id/180/900/650"
      alt="Modern workspace with laptop"
    >

    <span class="image-label">NEW SETUP</span>
  </div>

  <div class="post-summary">
    <div class="reaction-summary">
      <span class="reaction like">♥</span>
      <span class="reaction wow">★</span>
      <span>1.2K reactions</span>
    </div>

    <div class="engagement-summary">
      <span>86 comments</span>
      <span>24 shares</span>
    </div>
  </div>

  <div class="post-actions">
    <button type="button">
      <span>♡</span>
      Like
    </button>

    <button type="button">
      <span>◯</span>
      Comment
    </button>

    <button type="button">
      <span>↗</span>
      Share
    </button>
  </div>

  <div class="comment-preview">
    <img
      src="https://i.pravatar.cc/100?img=32"
      alt="Sarah Lee"
    >

    <div class="comment-bubble">
      <strong>Sarah Lee</strong>
      <p>This setup looks incredible! 🔥</p>
    </div>

    <button type="button" aria-label="Like comment">♡</button>
  </div>

  <form class="comment-form">
    <img
      src="https://i.pravatar.cc/100?img=12"
      alt="Your profile"
    >

    <div class="comment-input">
      <input
        type="text"
        placeholder="Write a comment..."
        aria-label="Write a comment"
      >

      <button type="button" aria-label="Add emoji">☺</button>
    </div>
  </form>
</article>
</body>
</html>
